[project]
name = "opspilot"
version = "0.1.0"
description = "An evidence-gathering agent for invoice and procurement exceptions, with human approval before any consequential action."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "docling==2.137.0",
    "faker>=40.43.0",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "structlog>=26.1.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "uvicorn>=0.54.0",
    "weasyprint>=70.0",
]

[project.scripts]
opspilot = "opspilot.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv]
python-preference = "managed"

# CPU-only PyTorch on Linux (Docker, CI): the default Linux wheels bundle CUDA and are
# several GB. macOS wheels are CPU-only already.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "N", "ASYNC", "BLE", "T20"]
ignore = ["PLR0913"]
# Typographic characters used on purpose in UI and policy text (07-design.md §5).
allowed-confusables = ["−", "×", "–", "±", "•"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
# Migrations build DDL from module constants (no external input) and carry long SQL.
"alembic/versions/**" = ["S608", "E501", "PLR0915"]
# The generator draws scenario choices with explicit probabilities (documented in docs/datasets.md).
"src/opspilot/evaluation/generator/build.py" = ["PLR2004", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs a real PostgreSQL (TEST_DATABASE_URL); skipped when it isn't set",
  "docling: runs Docling on real PDFs (downloads its models on first use; a few seconds each)",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
