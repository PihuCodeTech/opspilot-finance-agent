{% extends "base.html" %}
{% block title %}{{ status }} · OpsPilot{% endblock %}
{% block main %}
  <h1>{% if status == 404 %}Not found{% elif status == 403 %}Not allowed{% elif status == 409 %}The case has changed{% else %}Something went wrong{% endif %}</h1>
  <p role="alert">{{ message }}</p>
  <p><a href="/">Back to cases</a></p>
{% endblock %}
