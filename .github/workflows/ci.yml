# Lint, types and tests on every push and pull request.
# Actions are pinned to commit SHAs (supply-chain safety; setup-uv publishes no major tags).
# No secrets are used: tests never call a live LLM (LLM_MODE=replay), so CI costs nothing.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: opspilot_test
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      LLM_MODE: replay
      OPSPILOT_REQUIRE_RENDER: "1"  # the PDF-rendering test may not skip here
      DATABASE_URL: postgresql+psycopg://opspilot:ci-only-password@localhost:5432/opspilot_test
      TEST_DATABASE_URL: postgresql+psycopg://opspilot:ci-only-password@localhost:5432/opspilot_test
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-000
      BANK_HMAC_KEY: ci-only-bank-hmac-key-not-used-anywhere-else-00000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (no floating major tags upstream)
      - name: Pango for WeasyPrint (PDF rendering tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: uv sync --frozen
      - name: Cache Docling models (Hugging Face)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: docling-models-${{ hashFiles('uv.lock') }}
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Chromium for the browser journeys (Playwright, free download)
        run: uv run playwright install --with-deps chromium
      - run: uv run alembic upgrade head
      - run: uv run pytest
