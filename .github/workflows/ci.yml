# Lint, types and tests on every push and pull request.
# No secrets are used: tests never call a live LLM (LLM_MODE=replay), so CI costs nothing.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: opspilot_test
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      LLM_MODE: replay
      DATABASE_URL: postgresql+psycopg://opspilot:ci-only-password@localhost:5432/opspilot_test
      TEST_DATABASE_URL: postgresql+psycopg://opspilot:ci-only-password@localhost:5432/opspilot_test
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-000
      BANK_HMAC_KEY: ci-only-bank-hmac-key-not-used-anywhere-else-00000
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest
