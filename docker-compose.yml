# Local and preview runtime. Everything here is free and runs locally.
# Usage: cp .env.example .env (fill it in), then: docker compose up --build
# The optional TruFor service (profile "forensics") is added in P15.

services:
  db:
    image: pgvector/pgvector:pg17
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    image: opspilot:dev  # built by the app service: one image, never stale
    env_file: .env
    # Migrate as the owner, then enable the runtime roles' logins from .env.
    command: ["sh", "-c", "alembic upgrade head && opspilot db provision-roles"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    image: opspilot:dev
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - documents:/app/data/documents
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    image: opspilot:dev
    env_file: .env
    command: ["opspilot", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - documents:/app/data/documents

  # One-off dataset commands (generate, verify, load, freeze). Only this service mounts
  # the bundles, which contain labels.json; app and worker never see labels (rules.md §2).
  # Usage: docker compose run --rm tools opspilot generate --split dev
  tools:
    image: opspilot:dev
    profiles: ["tools"]
    env_file: .env
    user: root
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - documents:/app/data/documents
      - ./data/datasets:/app/data/datasets
      - ./data/releases:/app/data/releases
      - ./tests/fixtures/llm:/app/tests/fixtures/llm

volumes:
  db-data:
  documents:
